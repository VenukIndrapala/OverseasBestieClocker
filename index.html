<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Questions</title>
<link rel="preload" as="image" href="coin.png">
<link rel="stylesheet" href="letter.css">
</head>
<body>

<main class="stage">

  <!-- left: the three question cards (same look as the cards in the dashboard's Today's Log) -->
  <section class="qpanel reveal" style="--dx:-110px;--i:0" aria-label="Three questions">
    <ul id="qlist">

      <li class="qc reveal lift" data-q="1" style="--dy:-60px;--i:1">
        <div class="qtop">
          <label class="qh" for="a1"><span class="qn">01.</span><b>Name of the person who&#8217;s beating bestie?</b></label>
          <span class="ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        </div>
        <div class="qrow">
          <span class="fx"><input type="text" id="a1" class="ans" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Type a name, press Enter" aria-label="Question 1 answer"></span>
          <button type="button" class="qbtn" data-pop>Check</button>
        </div>
      </li>

      <li class="qc reveal lift" data-q="2" style="--dy:-60px;--i:2">
        <div class="qtop">
          <label class="qh" for="a2"><span class="qn">02.</span><b>Name of the person Venuk is going to miss for a week?</b></label>
          <span class="ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        </div>
        <div class="qrow">
          <span class="fx"><input type="text" id="a2" class="ans" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Type a name, press Enter" aria-label="Question 2 answer"></span>
          <button type="button" class="qbtn" data-pop>Check</button>
        </div>
      </li>

      <li class="qc reveal lift" data-q="3" style="--dy:-60px;--i:3">
        <div class="qtop">
          <label class="qh" for="a3"><span class="qn">03.</span><b>Name of the person who never backs down and never gives up?</b></label>
          <span class="ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        </div>
        <div class="qrow">
          <span class="fx"><input type="text" id="a3" class="ans" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Type a name, press Enter" aria-label="Question 3 answer"></span>
          <button type="button" class="qbtn" data-pop>Check</button>
        </div>
      </li>

    </ul>
  </section>

  <!-- right: the closed envelope. It opens by itself once all three answers are right; the coin inside can be dragged out -->
  <section class="envwrap reveal" style="--dx:110px;--i:2" aria-label="Sealed envelope">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>

      <!-- the letter sheet resting inside the envelope (only its top shows once the flap is up) -->
      <div class="paper" aria-hidden="true">
        <svg class="orn" viewBox="0 0 64 14">
          <circle cx="9" cy="7" r="3.1" fill="none" stroke="#b3382a" stroke-width="1.3"/>
          <circle cx="55" cy="7" r="3.1" fill="none" stroke="#b3382a" stroke-width="1.3"/>
          <path d="M14 7h9M41 7h9" stroke="#c98f84" stroke-width="1" stroke-linecap="round"/>
          <g transform="translate(25.6 0.6) scale(.52)"><path fill="#a3120a" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></g>
        </svg>
        <i class="ln l1"></i><i class="ln l2"></i>
      </div>

      <div class="coin in-env" id="coin" role="img" aria-label="Gold coin. Once it is out of the envelope you can drag it anywhere." tabindex="-1">
        <div class="coin-bob"><img src="coin.png" alt="" width="320" height="320" draggable="false" decoding="async"></div>
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
      </div>

      <!-- the front of the envelope: left + right folds and the bottom fold with its rounded top edge -->
      <div class="env-front" aria-hidden="true">
        <svg viewBox="0 0 300 200" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde8be"/><stop offset="1" stop-color="#f9dba6"/></linearGradient>
            <linearGradient id="gR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fde8be"/><stop offset="1" stop-color="#f9dba6"/></linearGradient>
            <linearGradient id="gB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fde4b5"/><stop offset="1" stop-color="#fee9c3"/></linearGradient>
            <filter id="fFold" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="-.6" stdDeviation="1.7" flood-color="#8a5a1e" flood-opacity=".34"/></filter>
          </defs>
          <g filter="url(#fFold)">
            <path d="M0 0L150 112L0 200Z" fill="url(#gL)"/>
            <path d="M300 0L150 112L300 200Z" fill="url(#gR)"/>
          </g>
          <path filter="url(#fFold)" d="M0 200L104 77.7Q150 60 196 77.7L300 200Z" fill="url(#gB)"/>
        </svg>
      </div>

      <!-- the flap: outer face (with the heart seal) while closed, inner face once it has swung up -->
      <div class="env-flap">
        <div class="face out">
          <svg viewBox="0 0 300 112">
            <defs>
              <linearGradient id="gFo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee8bf"/><stop offset="1" stop-color="#fcdfaa"/></linearGradient>
              <radialGradient id="gSeal" cx=".38" cy=".3" r=".9"><stop offset="0" stop-color="#b3200f"/><stop offset="1" stop-color="#780a02"/></radialGradient>
              <filter id="fFlap" filterUnits="userSpaceOnUse" x="-10" y="-10" width="320" height="140"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#6b4210" flood-opacity=".32"/></filter>
              <filter id="fSeal" filterUnits="userSpaceOnUse" x="90" y="40" width="120" height="90"><feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#3a0500" flood-opacity=".5"/></filter>
            </defs>
            <path filter="url(#fFlap)" d="M0 0H300L204 73.5Q150 140 96 73.5Z" fill="url(#gFo)"/>
            <g filter="url(#fSeal)"><g transform="translate(124.8 56.4) scale(2.1)"><path fill="url(#gSeal)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></g></g>
          </svg>
        </div>
        <div class="face in">
          <svg viewBox="0 0 300 112">
            <defs>
              <linearGradient id="gFi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9deac"/><stop offset="1" stop-color="#fde6b9"/></linearGradient>
            </defs>
            <path d="M0 0H300L204 73.5Q150 140 96 73.5Z" fill="url(#gFi)"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="progress" id="progress" role="status" aria-label="0 of 3 answers correct"><i></i><i></i><i></i></div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="letter.js"></script>
</body>
</html>
